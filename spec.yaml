id: covariate_labeling
requirements:
- name: ecoscope-platform
  version: 2.16.1
  channel: https://repo.prefix.dev/ecoscope-workflows/
  # ecoscope-platform already declares this exact pydeck dependency. it is
  # re-stated here as a workaround for a known issue. for further detail, see:
  # https://github.com/wildlife-dynamics/wt/issues/167#issuecomment-4451993697
- name: pydeck
  version: 0.9.2
  channel: conda-forge
#- name: covariate-labeling-tasks
  #path: /Users/la/pgaff/bull_movement/covariate-labeling
  #editable: true

- name: covariate-labeling-tasks
  path: /Users/la/pgaff/bull_movement/covariate-labeling
  editable: true
rjsf-overrides:
  properties:
    Subject Group.properties.subject_obs.properties.subject_group_name.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: subject_group_name
        depends_on: properties.er_client_name.properties.data_source.properties.name
    groupers.properties.groupers.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: spatial_feature_group
        depends_on: properties.er_client_name.properties.data_source.properties.name
  $defs:
    ValueGrouper.properties.index_name.oneOf:
    - const: subject_name
      title: Subject Name
    - const: subject_subtype
      title: Subject Subtype
    - const: subject_sex
      title: Subject Sex
  uiSchema:
    groupers.groupers.items.anyOf:
    - ui:options:
        label: false
    - ui:options:
        label: false
    - ui:options:
        label: false
    label_static.image_id:
      ui:title: Static image ID (asset path)
      ui:help: Full Earth Engine image asset ID -- a path, not a band name -- e.g. USGS/SRTMGL1_003. One static image is sampled per segment (elevation).
    label_covariates.image_collection_id:
      ui:title: Image collection ID (asset path)
      ui:help: Full Earth Engine ImageCollection asset ID -- a path, not a band name -- e.g. MODIS/061/MYD13A1. The NDVI band is read from it.
    label_covariates.image_stack:
      ui:title: Image stack
      ui:help: How many images to pull around each segment's closest-in-time image. 0 = only the nearest image (one value per segment); higher values use a window and can add rows.
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Data Source
  id: er_client_name
  task: set_er_connection
- name: Earth Engine Connection
  id: gee_client_name
  task: set_gee_connection
- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Extract Timezone Selection
  id: get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.time_range.return }}
- title: Subject Group
  type: task-group
  description: Choose a subject group to analyze
  tasks:
  - name:
    id: subject_obs
    task: get_subjectgroup_observations
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      raise_on_empty: false
      include_details: false
      include_subjectsource_details: false
      filter: clean
- name: Convert to timezone
  id: convert_to_user_timezone
  task: convert_values_to_timezone
  partial:
    df: ${{ workflow.subject_obs.return }}
    timezone: ${{ workflow.get_timezone.return }}
    columns:
    - fixtime
- name: Group Data
  id: groupers
  task: set_groupers
- task: extract_spatial_grouper_feature_group_names
  id: spatial_group_ids
  partial:
    groupers: ${{ workflow.groupers.return }}
- task: get_spatial_features_group
  id: fetch_all_spatial_feature_groups
  partial:
    client: ${{ workflow.er_client_name.return }}
  map:
    argnames: spatial_features_group_name
    argvalues: ${{ workflow.spatial_group_ids.return }}
- task: resolve_spatial_feature_groups_for_spatial_groupers
  id: resolved_groupers
  skipif:
    conditions:
    - never
  partial:
    groupers: ${{ workflow.groupers.return }}
    spatial_feature_groups: ${{ workflow.fetch_all_spatial_feature_groups.return }}
- name: Transform Observations to Relocations
  id: subject_reloc
  task: process_relocations
  partial:
    observations: ${{ workflow.convert_to_user_timezone.return }}
    relocs_columns:
    - groupby_col
    - fixtime
    - junk_status
    - geometry
    - extra__subject__name
    - extra__subject__subject_subtype
    - extra__subject__sex
    filter_point_coords:
    - x: 180.000000
      y: 90.000000
    - x: 0.000000
      y: 0.000000
    - x: 1.000000
      y: 1.000000
- name: Apply Day/Night Labels to Relocations
  id: day_night_labels
  task: classify_is_night
  partial:
    relocations: ${{ workflow.subject_reloc.return }}
- name: Trajectory Segment Filter
  id: subject_traj
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.day_night_labels.return }}
- name: Add temporal index to Subject Trajectories
  id: traj_add_temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.subject_traj.return }}
    time_col: segment_start
    groupers: ${{ workflow.resolved_groupers.return }}
    cast_to_datetime: true
    format: mixed
- name: Add spatial index to Subject Trajectories
  id: traj_add_spatial_index
  task: add_spatial_index
  partial:
    gdf: ${{ workflow.traj_add_temporal_index.return }}
    groupers: ${{ workflow.resolved_groupers.return }}
- name: Rename value grouper columns
  id: rename_grouper_columns
  task: map_columns
  partial:
    df: ${{ workflow.traj_add_spatial_index.return }}
    drop_columns: []
    retain_columns: []
    rename_columns:
      extra__name: subject_name
      extra__subject_subtype: subject_subtype
      extra__sex: subject_sex
    raise_if_not_found: true
- name: Map Subject Sex Values
  id: map_subject_sex
  task: map_values
  partial:
    df: ${{ workflow.rename_grouper_columns.return }}
    column_name: subject_sex
    value_map:
      male: male
      female: female
    missing_values: replace
    replacement: unknown
- name: Label segments with a static image covariate (GEE)
  id: label_static
  task: label_with_static_image
  partial:
    client: ${{ workflow.gee_client_name.return }}
    df: ${{ workflow.map_subject_sex.return }}
    bands:
    - elevation
    reducer: mean
    scale: 30
    df_chunk_size: 5000
    column_prefix: ''
- name: Label trajectory segments with NDVI (GEE temporal)
  id: label_covariates
  task: label_with_temporal_image_collection
  partial:
    client: ${{ workflow.gee_client_name.return }}
    df: ${{ workflow.label_static.return }}
    time_column: segment_start
    column_prefix: ''
    scale: 500
    df_chunk_size: 5000
    bands:
    - NDVI
    reducer: mean
- name: Drop patrol columns
  id: clean_traj
  task: map_columns
  partial:
    df: ${{ workflow.label_covariates.return }}
    drop_columns:
    - extra__patrol_serial_number
    - extra__patrol_status
    - extra__patrol_subject
    - extra__patrol_type__value
    retain_columns: []
    rename_columns: {}
    raise_if_not_found: false
- name: Persist full trajectory table (parquet, with geometry)
  id: persist_traj_parquet
  task: persist_df
  partial:
    df: ${{ workflow.clean_traj.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: trajectories
    filetype: parquet
- name: Drop geometry so the export is a clean tabular CSV
  id: export_table_cols
  task: map_columns
  partial:
    df: ${{ workflow.clean_traj.return }}
    drop_columns:
    - geometry
    retain_columns: []
    rename_columns: {}
    raise_if_not_found: false
- name: Persist trajectory stats table (CSV, for R)
  id: persist_traj_csv
  task: persist_df
  partial:
    df: ${{ workflow.export_table_cols.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: trajectory_stats
    filetype: csv
- name: Results view
  id: covariate_dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    widgets: []
    groupers: ${{ workflow.resolved_groupers.return }}
    time_range: ${{ workflow.time_range.return }}
