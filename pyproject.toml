[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "covariate-labeling-tasks"
dynamic = ["version"]
description = "GEE covariate-labeling tasks for the covariate-labeling workflow."
requires-python = ">=3.11"
# ecoscope-platform and wt-registry are provided by the workflow env at runtime.
dependencies = []

# Makes @register()-decorated tasks discoverable by wt-registry by name.
[project.entry-points."wt_registry"]
covariate_labeling_tasks = "covariate_labeling_tasks.tasks"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/covariate_labeling_tasks"]

# ---- pixi: local dev + the compile environment (replaces the old pixi.toml) ----
[tool.pixi.workspace]
channels = ["https://repo.prefix.dev/ecoscope-workflows/", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
covariate-labeling-tasks = { path = ".", editable = true }

[tool.pixi.feature.compile.dependencies]
wt-compiler = "*"
graphviz = "*"
go-yq = "*"

[tool.pixi.feature.compile.tasks]
register-graphviz = "dot -c"
compile = { cmd = "wt-compiler compile --spec=spec.yaml --pkg-name-prefix=ecoscope-workflows --results-env-var=ECOSCOPE_WORKFLOWS_RESULTS --clobber --install", depends-on = ["register-graphviz"] }

[tool.pixi.environments]
compile = ["compile"]
