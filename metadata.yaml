name: Subject Trajectory Export

# at least one author is required
author:
  - name: "Rodney Omukuti"
    organization: "Wildlife Dynamics"
    email: "rodney@wildlifedynamics.com"

description: >-
  Builds cleaned trajectories for a subject group and exports the full
  segment-level table (step length, duration, speed, NSD) as downloadable
  parquet and CSV for external analysis (e.g. R). Includes an NSD chart and
  lightweight per-subject summary tiles. Omits the home-range (ETD) calculation
  and map rendering so it runs quickly over large, multi-year datasets.

